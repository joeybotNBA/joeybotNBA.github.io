/* Layout: one column of controls, then headline tiles, a period-by-period bar table, and two side-by-side tables. */
/* Dark arena: one always-dark look, navy surfaces with a basketball-orange accent. */
:root {

  --body: system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
body { background: var(--plane); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.45; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 40px; display: flex; flex-direction: column; gap: 20px; }
h1 { font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1; margin: 0; letter-spacing: 0.01em; text-transform: uppercase; }
h2 { font-family: var(--display); font-weight: 600; font-size: 20px; margin: 0; text-transform: uppercase; letter-spacing: 0.03em; }
.sub { color: var(--ink2); margin: 6px 0 0; }
.label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink2); }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 16px; min-width: 0; }

.controls { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 14px 20px; align-items: flex-end; }
.field { display: flex; flex-direction: column; gap: 5px; }
select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--axis); border-radius: 4px; padding: 7px 10px; min-width: 120px; }
.seg { display: inline-flex; border: 1px solid var(--axis); border-radius: 4px; overflow: hidden; }
.seg button { font: inherit; font-weight: 600; color: var(--ink2); background: var(--surface); border: 0; border-left: 1px solid var(--axis); padding: 7px 16px; cursor: pointer; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--axis); border-radius: 999px; padding: 5px 12px; cursor: pointer; display: inline-flex; gap: 8px; align-items: baseline; }
.chip small { color: var(--muted); font-size: 12px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip[aria-pressed="true"] .nm { text-decoration: line-through; }
.chip[aria-pressed="true"] small { color: var(--surface); opacity: 0.8; }
.chip:disabled { cursor: default; opacity: 0.5; }
.link { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
button:focus-visible, select:focus-visible, th:focus-visible, tr:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.status { color: var(--ink2); }

.warn { display: inline-block; margin-left: 8px; padding: 1px 8px; border: 1px solid var(--axis); border-radius: 999px; font-size: 12px; font-weight: 600; }

.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.tile { display: flex; flex-direction: column; gap: 2px; }
.big { font-family: var(--display); font-weight: 700; font-size: 52px; line-height: 1; }
.big span { font-size: 26px; font-weight: 600; margin-left: 1px; }
.rec { color: var(--ink2); font-variant-numeric: tabular-nums; }
.delta { font-weight: 600; font-variant-numeric: tabular-nums; }
.up { color: var(--good); } .down { color: var(--bad); } .flat { color: var(--ink2); }

.periods { display: grid; grid-template-columns: 96px 92px minmax(80px, 1fr) 56px 74px; gap: 10px 14px; align-items: center; margin-top: 12px; }
.periods .hd { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink2); }

.track { position: relative; height: 12px; background: var(--accent-soft); border-radius: 0 4px 4px 0; }

.mid { position: absolute; left: 50%; top: -4px; bottom: -4px; width: 1px; background: var(--ink2); }
.base { position: absolute; top: -5px; bottom: -5px; width: 3px; margin-left: -1.5px; background: var(--ink); border: 1px solid var(--surface); box-sizing: content-box; border-radius: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 14px; color: var(--ink2); font-size: 12px; }

.two { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 20px; }
.scroll { overflow: auto; max-height: 460px; margin-top: 10px; }

tr.pick { cursor: pointer; }

.res { display: inline-block; width: 18px; margin-left: 6px; font-weight: 700; text-align: center; }
.res.W { color: var(--good); } .res.L { color: var(--bad); } .res.T { color: var(--ink2); }
.note { color: var(--ink2); font-size: 12.5px; max-width: 78ch; margin: 0; }
.empty { color: var(--ink2); padding: 20px 0; }

// Points the two teams' own scoring habits add to (or take off) a period total, beyond the split of the game total.
function totalLean(g, p) {
  if (g.lg) return 0;
  const T = D.tend, i = T.periods.indexOf(p), h = T.teams[g.home.ab], a = T.teams[g.away.ab];
  return i < 0 || !h || !a ? 0 : T.w[p] * (h.t[i] + a.t[i]);

// The model for a game's league, and that league's logo for a team.
const MODEL = g => (g.lg === "wnba" ? D.w.m : D.m);
const teamLogo = (g, t, cls) => (!g.lg ? logo(t.ab, cls) : t.logo ? `<img class="logo${cls ? " " + cls : ""}" src="${esc(t.logo)}" alt="" onerror="this.hidden=true">` : "");

/* ---------- The sportsbook's own lines for halves, quarters and player props (ESPN's feed, usually DraftKings) ---------- */
// Only 1st-quarter and 1st-half bets are shown (user, 2026-10-27).
const BK_PERIOD = { "1st Half": "H1", "1st Quarter": "Q1" };
const BK_MILE = { "Points Milestones": "pts", "Assists Milestones": "ast", "Rebounds Milestones": "reb", "3-Point Field Goals Milestones": "tpm", "Points + Assists + Rebounds Milestones": "pra" };
const BK_PROP = { "Total Points": "pts", "Total Rebounds": "reb", "Total Assists": "ast", "Total 3-Point Field Goals": "tpm", "Total Points and Assists": "pa",
  "Total Points and Rebounds": "pr", "Total Assists and Rebounds": "ra", "Total Points, Rebounds, and Assists": "pra" };

function recallBook(g) {

}
async function loadBook(g) {

  try {

      const d = await res.json(); items.push(...(d.items || []));

    }
  } catch (err) { return; }
  const refId = x => (x && x.$ref ? x.$ref.split("?")[0].split("/").pop() : null), dk = { per: {}, players: {}, miles: {}, tt: {}, dd: {}, n: 0 };

    const pm = name.match(/^(1st Half|1st Quarter) (Spread|Moneyline|Total)$/);

      else if (pm[2] === "Moneyline" && side) (P.ml || (P.ml = {}))[side] = { am };
      else if (pm[2] === "Total" && line != null) { const X = P.tot || (P.tot = { line }); if (!("over" in X)) X.over = am; else X.under = am; }   // the feed lists the over first
      continue;
    }
    if (name === "Team Total Points" && line != null) {
      const tid = refId(it.team), side = tid === g.home.id ? "home" : tid === g.away.id ? "away" : null;
      if (side) { const X = dk.tt[side] || (dk.tt[side] = { line }); if (!("over" in X)) X.over = am; else X.under = am; }
      continue;
    }
    if (name === "To Record a Double Double") { const aid = refId(it.athlete); if (aid && am != null) dk.dd[aid] = am; continue; }
    if (BK_MILE[name] && line != null) { const aid = refId(it.athlete); if (aid) ((dk.miles[aid] || (dk.miles[aid] = {}))[BK_MILE[name]] || (dk.miles[aid][BK_MILE[name]] = [])).push({ n: line, am }); continue; }
    const prop = BK_PROP[name], aid = refId(it.athlete);

}

function preMarkets(g, p) {

    { key: "tot", title: `${nm} total${tag(tot)}`, book: tot, line: { label: "Total", def: tot ? tot.line : half(muT) }, rows: X => pair(above(muT, m.sd_t, X), `Under ${X}`, `Over ${X}`).reverse() },

// Winning-margin bands, like a sportsbook's margin market. mu and sd describe the final home margin.
const BANDS = [[1, 10], [11, 20], [21, 30], [31, Infinity]];
function marginMarket(g, mu, sd) {
  const A = g.away.ab, H = g.home.ab, cdf = x => phi((x - mu) / sd);

  const band = (lo, hi, home) => (home ? cdf(hi + 0.5) - cdf(lo - 0.5) : cdf(-lo + 0.5) - cdf(-hi - 0.5)) + (lo === 1 ? tie / 2 : 0);
  const name = (lo, hi) => (hi === Infinity ? `${lo}+` : `${lo}-${hi}`);
  const say = x => { const r = Math.round(x); return r > 0 ? `${H} by ${r}` : r < 0 ? `${A} by ${-r}` : "even"; };
  // Favorite's bands first.
  const order = mu >= 0 ? [true, false] : [false, true];
  return {
    key: "wm", title: "Winning margin", count: BANDS.length * 2,
    note: () => `Most likely finish: ${say(mu)}. Half of games like this end between ${say(mu - 0.674 * sd)} and ${say(mu + 0.674 * sd)}; 8 in 10 end between ${say(mu - 1.282 * sd)} and ${say(mu + 1.282 * sd)}.`,
    rows: () => order.flatMap(home => BANDS.map(([lo, hi]) => { const p = band(lo, hi, home); return [`${home ? H : A} by ${name(lo, hi)}`, p, 1 - p, 0]; })),
  };
}

// In-game: st is "Q1" (after the 1st quarter), "H1" (halftime) or "E3" (after the 3rd quarter); a and h are the scores so far.
function liveMarkets(g, st, a, h) {

  const total = (key, title, k) => ({ key, title: `${title} total`, line: { label: "Total", def: half(muT(k)) }, rows: T => pair(above(muT(k), sd(k), T), `Under ${T}`, `Over ${T}`).reverse() });

    { key: "gw", title: "Game winner", rows: () => [[`${A} wins game`, 1 - ph, ph, 0], [`${H} wins game`, ph, 1 - ph, 0]] },
    { key: "gs", title: "Game spread", fair: half(-(sm + muM("rest_m"))), line: { label: `${H} line`, def: g.hs }, rows: X => pair(above(muM("rest_m"), sd("rest_m"), -X - sm), `${A} ${signed(-X)}`, `${H} ${signed(X)}`) },
    { key: "gt", title: "Game total", fair: half(stot + muT("rest_t")), line: { label: "Total", def: g.total }, rows: T => pair(above(muT("rest_t"), sd("rest_t"), T - stot), `Under ${T}`, `Over ${T}`).reverse() },
    marginMarket(g, sm + muM("rest_m"), sd("rest_m")),

      { key: "hs", title: "1st half spread", line: { label: `${H} line`, def: half(-(sm + muM("Q2_m"))) }, rows: X => pair(above(muM("Q2_m"), sd("Q2_m"), -X - sm), `${A} ${signed(-X)}`, `${H} ${signed(X)}`) },
      { key: "ht", title: "1st half total", line: { label: "Total", def: half(stot + muT("Q2_t")) }, rows: T => pair(above(muT("Q2_t"), sd("Q2_t"), T - stot), `Under ${T}`, `Over ${T}`).reverse() });

      winner("q3", "3rd quarter", "Q3_m"), winner("q4", "4th quarter", "Q4_m"), winner("h2", "2nd half", "H2_m"),
      { key: "s2", title: "2nd half spread", line: { label: `${H} line`, def: half(-muM("H2_m")) }, rows: X => pair(above(muM("H2_m"), sd("H2_m"), -X), `${A} ${signed(-X)}`, `${H} ${signed(X)}`) },
      { key: "t2", title: "2nd half total", line: { label: "Total", def: half(muT("rest_t")) }, rows: T => pair(above(muT("rest_t"), sd("rest_t"), T), `Under ${T}`, `Over ${T}`).reverse() });

}

function renderMarkets(g, scope, markets, el) {

  const head = `<div class="hd">Bet</div><div class="hd r">Hit %</div><div class="hd r c-fair">Fair odds</div><div class="hd r">Book odds</div><div class="hd r">Edge</div>`;
  el.innerHTML = markets.map(m => {

    const row = i => `<div id="sd-${id}-${i}"></div><div class="r hit" id="hit-${id}-${i}"></div><div class="r c-fair" id="fair-${id}-${i}"></div>` +
      `<input id="od-${id}-${i}" data-g="${g.id}" data-s="${scope}" data-f="od-${m.key}-${i}" inputmode="text" placeholder="odds" aria-label="Sportsbook odds" value="${esc(val(`od-${m.key}-${i}`, m.book && m.book.odds[i] != null ? m.book.odds[i] : ""))}">` +

function recalcMarkets(g, scope) {
  for (const m of SL.mk[`${g.id}|${scope}`] || []) {
    const id = `${g.id}-${scope}-${m.key}`;
    let line = null;
    if (m.line) { const v = parseFloat($("ln-" + id).value); line = isFinite(v) ? v : m.line.def; }
    const rows = m.rows(line);
    if (m.tie) $("tie-" + id).textContent = `Tie ${(rows[0][3] * 100).toFixed(1)}%`;
    if (m.note) $("note-" + id).textContent = m.note();
    const odds = rows.map((_, i) => $(`od-${id}-${i}`).value), both = rows.length === 2 && odds.every(o => parseAm(o) != null);
    rows.forEach(([label, win, lose, push], i) => {
      $(`sd-${id}-${i}`).textContent = label;
      const hit = $(`hit-${id}-${i}`), fairP = win / (win + lose);
      // With a price on both sides, the model's chance is averaged with the price's own (a push counts as a refund).
      const shown = both ? blend(fairP, odds[i], odds[1 - i]) : win;
      hit.textContent = (shown * 100).toFixed(1) + "%";
      hit.title = (both ? `Model alone ${(win * 100).toFixed(1)}%. ` : "") + (push > 0.0005 ? `Push ${(push * 100).toFixed(1)}%, lose ${(lose * 100).toFixed(1)}%` : `Lose ${(lose * 100).toFixed(1)}%`);
      $(`fair-${id}-${i}`).textContent = toAm(fairP);
      const am = parseAm(odds[i]), ed = $(`edge-${id}-${i}`);

      const ev = (both ? shown * profit(am) - (1 - shown) : win * profit(am) - lose) * 100;
      SL.edges[`${id}-${i}`] = { g, scope, label, win, ev, am };
      ed.textContent = (ev > 0 ? "+" : ev < 0 ? "−" : "") + Math.abs(ev).toFixed(1) + "%";
      ed.className = "r edge " + (ev > 0.05 ? "up" : ev < -0.05 ? "down" : "");
      ed.title = `Needs to hit ${(implied(am) * 100).toFixed(1)}% to break even`;
    });

}

/* ---------- Model picks: top plays on the slate and the pick for each game ---------- */
SL.edges = {};

const PRICEY = 0.60, LEAN = 0.524;
// With a sportsbook price, the aim is to win the bet. A play qualifies at a price of -150 or better when either
//   it is likely: 55% or better, and the price is not a losing one by the model's numbers (edge of zero or more), or
//   it is a little less likely but well priced: 53% or better with an edge of 5% or more (for example 54% at -104).
const SEND = 0.55, VALUE = 0.53, VALUE_EDGE = 0.05;

const grade = c => (c.ev != null ? (c.am < -150 ? 2 : hits(c.win, c.ev) ? 0 : 1) : c.win > PRICEY ? 2 : c.win < LEAN ? 1 : 0);

// A sportsbook's line already reflects news and matchups the model cannot see, so against a real price the model's chance
// is averaged with the price's own implied chance (its cut removed). MARKET is the weight on the sportsbook.
const MARKET = 0.5;

const PROP_MARKET = 0.6, PROP_HIGH = 0.58, PROP_HIGH_PRICE = -120;

const edgeText = ev => (ev > 0 ? "+" : ev < 0 ? "−" : "") + Math.abs(ev * 100).toFixed(1) + "%";

  for (const p of ["H1", "Q1"]) for (const m of preMarkets(g, p)) {
    if (!m.book) continue;

      win = blend(win / (win + lose), m.book.odds[i], m.book.odds[1 - i]);   // a push is treated as a refund

        : m.key === "ml" ? `${t.ab} then wins the game ${i === fav ? P.fav : P.dog}%` : `${t.ab} then covers the game spread ${P.cover}%`;
      out.push({ g, win, fair: win, am, ev: win * profit(am) - (1 - win), logo: t ? teamLogo(g, t, "sm") : "", text: m.key === "ml" ? label : `${label}, ${PNAME[p]}`, pair,
        gr: m.key === "tot" ? { k: "tot", p, over: i === 0, line: m.book.line } : m.key === "sp" ? { k: "sp", p, home: i === 1, line: i === 1 ? m.book.line : -m.book.line } : { k: "ml", p, home: i === 1 } });

    const x = teamTotal(g, side, "FG"), r = above(x.mu, x.sd, tt.line);
    [["over", r.win, tt.over, tt.under], ["under", r.lose, tt.under, tt.over]].forEach(([word, w, mine, other]) => {
      const am = parseAm(mine); if (am == null) return;
      const win = blend(w / (r.win + r.lose), mine, other);
      out.push({ g, win, fair: win, am, ev: win * profit(am) - (1 - win), logo: teamLogo(g, g[side], "sm"), text: `${g[side].ab} team total ${word} ${tt.line}`, pair: "", gr: { k: "tt", home: side === "home", over: word === "over", line: tt.line } });

  }

  const ad = adjust(g), out = pricedPlays(g), posted = (g.dk && g.dk.per) || {};
  for (const p of ["H1", "Q1"]) {

    const m = MODEL(g)[p], r = above(m.b * -g.hs + sumQ(ad.m, QS[p]), m.sd_m, 0), home = r.win >= r.lose;
    const win = home ? r.win : r.lose, lose = home ? r.lose : r.win, t = home ? g.home : g.away;
    out.push({ g, win, logo: teamLogo(g, t, "sm"), text: `${t.ab} to win the ${PNAME[p]}`, fair: win / (win + lose), gr: { k: "ml", p, home } });

// The single call to show on a game card: the top pregame call, or who wins from the current checkpoint.

    const l0 = F.line != null ? F.line : parseFloat((String(F.pick).match(/\d+(\.\d+)?/) || [])[0]), cur = p.moved || { line: p.line, am: L.am, win: L.win };

    const moveTag = way == null ? "" : `<span><span class="tag ${way ? "l2" : "l0"}" title="Since it was sent">${way ? "Moved your way" : "Moved against"}</span></span>`;
    const still = !gone || p.offStill == null ? null : p.offStill >= PROP_HIGH ? 2 : p.offStill >= 0.55 ? 1 : 0, fin = bbResult(g, p);

    const pi = PP.lists[x.lg] && PP.lists[x.lg].rows ? PP.lists[x.lg].rows.findIndex(r => r.a.id === p.aid && r.prop === p.prop) : -1;
    const cell = (label, c, win, est, extra) => `<span class="bbr-c"><span class="bb-tag">${label}</span><span><b>${dl ? `${c.line} at ` : ""}${c.am != null ? price(c.am) : "no price"}</b>${win != null ? ` · ${est ? "~" : ""}${pct(win)}` : ""}</span>${extra}</span>`;

      `<span class="bb-tag">${esc(p.tag)}</span><span class="bbr-pick ${p.cls}">${esc(F.pick)}</span><span class="bb-sub">${status}</span></span></button>` +
      cell(`Sent ${when(F.t)}`, { line: l0, am: F.am }, F.win, F.est, "") + cell(x.started ? "At tip" : "Now", cur, cur.win, false, moveTag) +
      (can ? `<button type="button" class="bb-add" data-leg="${esc(x.id)}" aria-pressed="${on}" aria-label="${on ? "Remove from" : "Add to"} parlay" title="${on ? "Remove from" : "Add to"} parlay">${on ? "✓" : "+"}</button>` : "<span></span>") + `</div>`; };
  // Order: every High at the top (a pulled play that is still High at its current price counts), then overs before unders,

    : bs.map(b => { const mine = xs.filter(x => b.ids.has(x.g.id)), live = mine.every(x => x.started);
        return `<h3 class="bt">${+b.start === +b.end ? hhmm(b.start) : `${hhmm(b.start)} to ${hhmm(b.end)}`} tips <span>· ${mine.length} play${mine.length === 1 ? "" : "s"}${live ? " · started" : ""}</span></h3>` + inner(mine); }).join(""); };
  // Team bets with a sportsbook price are shown; the model's unpriced calls fold into a row underneath.

    `<h2>Team bets</h2>` + (team.length ? byTime(team, grid)

// The calculator's boxes are built once and only its results are rewritten, so typing is never interrupted by a refresh.

    slip.innerHTML = `<div class="slip-top"><b>Parlay calculator</b><span class="slip-price" id="slip-price"></span><button type="button" class="btn" id="slip-bet" title="Save this bet to My bets on the Record tab">I bet this</button>` +
      `<button type="button" class="btn" id="slip-2">Best 2-leg</button><button type="button" class="btn" id="slip-3">Best 3-leg</button><button type="button" class="btn" id="slip-clear">Clear</button></div>` +
      `<div class="slip-legs" id="slip-legs"></div>` +
      `<div class="slip-nums"><label>Odds <input type="text" id="slip-own" inputmode="text" autocomplete="off" placeholder="-110 +150 -120" style="width:190px"></label>` +
      `<label>Stake $ <input type="number" id="slip-stake" min="1" step="1"></label></div><div class="slip-nums" id="slip-out"></div>`;
    $("slip-own").value = BB.own || ""; $("slip-stake").value = BB.stake; }
  const own = (String(BB.own || "").replace(/−/g, "-").match(/[+-]?\d+(\.\d+)?/g) || []).map(parseAm).filter(v => v != null);
  const priced = legs.filter(x => legAm(x) != null), need = legs.length - priced.length;

$("tab-best").addEventListener("click", e => {

/* ---------- My bets: what was actually placed, kept in this browser, graded from the final scores ---------- */
const MY = { list: [], games: {} };

const mySave = () => { try { localStorage.setItem("mybets", JSON.stringify(MY.list)); } catch (e) {} };
const ownOdds = () => (String(BB.own || "").replace(/−/g, "-").match(/[+-]?\d+(\.\d+)?/g) || []).map(parseAm).filter(v => v != null);
function myAdd() {
  if ((BB.legs || []).some(x => legAm(x) == null)) { $("slip-out").innerHTML = `<span>Type the odds for the leg in the orange box first.</span>`; return; }
  const legs = (BB.legs || []).map(x => ({ gid: x.g.id, lg: x.lg, when: +x.g.when, am: legAm(x), label: `${x.p.who ? x.p.who + " " : ""}${x.p.pick}`,

  MY.list.unshift({ id: Date.now(), t: Date.now(), stake: BB.stake || 0, legs: [...legs, ...typed], res: "" });

// A typed parlay price stands when every leg counts; a pushed or voided leg falls back to the legs' own prices.
const myDec = b => (b.price && !b.legs.some(l => l.res === "P" || l.res === "V") ? 1 + profit(b.price) : b.legs.filter(l => l.res !== "P" && l.res !== "V").reduce((d, l) => d * (1 + profit(l.am)), 1));

// A finished game by id: from the slate on screen, or looked up once.
async function finalGame(lg, gid) {

  if (MY.games[gid]) return MY.games[gid];
  try {
    const d = await (await fetch(`https://site.api.espn.com/apis/site/v2/sports/basketball/${lg}/summary?event=${gid}`)).json(), c = ((d.header || {}).competitions || [])[0];

async function myResolve() {

    for (const l of b.legs) { if (l.res || l.manual || Date.now() < l.when) continue;
      const g = await finalGame(l.lg, l.gid); if (!g) continue;
      if (l.p.kind === "prop" && (!BB.box[g.id] || BB.box[g.id] === "loading")) { try { BB.box[g.id] = await loadBox(g); } catch (err) { continue; } }
      const r = bbResult(g, l.p); if (r) { l.res = r.res; changed = true; } }
    // Lost as soon as one leg loses; won when every leg is in. Pushes and voids drop out of the price.
    if (b.legs.some(l => l.res === "L")) { b.res = "L"; changed = true; }
    else if (b.legs.every(l => l.res)) { b.res = b.legs.some(l => l.res === "W") ? "W" : "P"; changed = true; } }

/* ---------- Halftime: games in progress, re-priced from the score, and players behind their pace ---------- */
const LIVE = { box: {}, rows: {}, seq: 0, avgF: {} };
// A team's average fouls per game this season, from ESPN's team statistics (looked up once per team).
async function avgFouls(g, side) {
  const key = `${ppLg(g)}|${g[side].id}`;

    : `<span class="src">${g.total} · no lean (${g.pick.over ? "over" : "under"} ${g.pick.tp.toFixed(0)}%)</span>`);
  // A day with one game opens on the parlay builder.
  if (SL.nflView == null) SL.nflView = sgpGames().today.length === 1 ? "sgp" : "";
  const view = `<div class="seg" role="group" aria-label="View" id="nfl-view" style="margin:8px 0 12px;flex-wrap:wrap"><button type="button" data-v="" aria-pressed="${!SL.nflView}">Picks</button><button type="button" data-v="sgp" aria-pressed="${SL.nflView === "sgp"}">Parlay builder</button><button type="button" data-v="td" aria-pressed="${SL.nflView === "td"}">Touchdowns</button></div>`;
  if (SL.nflView === "sgp") { el.innerHTML = `<h2>NFL · Parlay builder</h2>` + view + nflSGPView(); return; }
  if (SL.nflView === "td") { el.innerHTML = `<h2>NFL · Touchdowns today</h2>` + view + nflTDView(); return; }
  el.innerHTML = `<h2>NFL · Week ${N.week}</h2><div class="src" style="margin:4px 0 0">Built ${esc(N.made)}</div>` + view +
    `<h3 style="margin-top:6px">Game picks</h3><div class="tw"><table class="ptab"><thead><tr><th>#</th><th class="l">Game</th><th>Winner</th><th>Moneyline</th><th>Spread</th><th>Total</th></tr></thead><tbody>` +
    picks.map((g, i) => `<tr><td class="rank">${i + 1}</td><td class="l"><b>${esc(g.away)} at ${esc(g.home)}</b> <span class="src">${nflWhen(g)}</span></td>` +
      `<td class="nw"><b>${esc(g.pick.team)}</b> <span class="hitc">${g.pick.p.toFixed(0)}%</span>${g.pick.p >= 70 ? ` <span class="tag l2">High</span>` : ""}</td>` +
      `<td class="nw">${g.pick.price ? showAm(g.pick.price) : "–"}</td><td class="nw">${line(g)}</td><td class="nw">${tot(g)}</td></tr>`).join("") + `</tbody></table></div>` +
    `<p class="src" style="margin-top:8px">The winner's chance comes from the sportsbook's spread, which tested as the best guide: my own team ratings added nothing to it over 170 test games, and on totals my number lost to the sportsbook's more often than it won. So a total only shows a pick when the lean reaches 55%, and most weeks none will. Moneyline favorites this strong are priced steeply, so they suit parlay legs more than single bets.</p>` +
    nflGameRecord() + NFL_CATS.map(([k, name]) => `<h3 style="margin-top:22px">Top ${name.toLowerCase()} plays</h3>` + nflTable(k, 5)).join("") +
    `<div style="margin-top:16px"><button type="button" class="btn" id="nfl-all">See all NFL props</button></div>`;
}
// The parlay builder's buttons, on the NFL tab and on Player props. Both views are redrawn so they stay in step.
const sgpRedraw = () => { renderNFL(); if (PP.slate === "nfl") renderSlateLists(); };
function sgpClick(e) {
  const leg = e.target.closest("[data-leg]"), bd = e.target.closest("[data-build]"), sm = e.target.closest("#sgp-mode button"), so = e.target.closest("#sgp-order button"), sd = e.target.closest("#sgp-day button");
  if (leg) SGP.sel.has(leg.dataset.leg) ? SGP.sel.delete(leg.dataset.leg) : SGP.sel.add(leg.dataset.leg);
  else if (bd && bd.dataset.build === "long") SGP.sel = new Set(sgpLong(sgpPool().legs));
  else if (bd) { const [n, t] = bd.dataset.build.split("|").map(Number); SGP.sel = new Set(sgpBuild(sgpPool().legs, n, t)); }
  else if (sm) { if (SGP.mode !== sm.dataset.m) { SGP.mode = sm.dataset.m; SGP.sel = new Set(); SGP.odds = ""; } }
  else if (so) SGP.order = so.dataset.o;
  else if (sd) { if (SGP.day !== sd.dataset.d) { SGP.day = sd.dataset.d; SGP.sel = new Set(); SGP.odds = ""; } }
  else if (e.target.id === "sgp-clear") { SGP.sel = new Set(); SGP.odds = ""; }
  else return false;
  sgpRedraw(); return true;
}
$("pp-slate").addEventListener("click", e => { const v = e.target.closest("#nfl-pp button"); if (v) { SL.nflPP = v.dataset.v; renderSlateLists(); return; } sgpClick(e); });
$("pp-slate").addEventListener("change", e => { if (e.target.id === "sgp-odds") { SGP.odds = e.target.value.trim(); sgpRedraw(); } });
$("nfl-body").addEventListener("click", e => { const vb = e.target.closest("#nfl-view button");
  if (vb) { SL.nflView = vb.dataset.v; renderNFL(); if (SL.nflView === "td") loadTD(); return; }
  if (sgpClick(e)) return;
  const tr = e.target.closest("[data-np]");
  if (tr) { SL.nflCat = tr.dataset.nc; SL.nflPick = tr.dataset.np; }
  if (tr || e.target.id === "nfl-all") { PP.slate = "nfl"; showTab("props"); renderSlateLists(); if (tr && $("nfl-card")) $("nfl-card").scrollIntoView({ behavior: "smooth", block: "start" }); } });
$("pp-slate").addEventListener("click", e => { const b = e.target.closest("#nfl-cat button"), c = e.target.closest("#nfl-side button");
  const tr = e.target.closest("[data-np]");
  const so = e.target.closest("#nfl-sort button");
  if (b) SL.nflCat = b.dataset.c; else if (c) SL.nflSide = c.dataset.s; else if (so) SL.nflSort = so.dataset.s; else if (tr) SL.nflPick = tr.dataset.np; else return;
  renderSlateLists();
  if (tr && $("nfl-card")) $("nfl-card").scrollIntoView({ behavior: "smooth", block: "nearest" }); });
$("nfl-body").addEventListener("toggle", e => { if (e.target.classList.contains("nfl-rec")) (SL.nflRec = SL.nflRec || {})[e.target.dataset.k] = e.target.open; }, true);
$("nfl-body").addEventListener("change", e => { if (e.target.id === "sgp-odds") { SGP.odds = e.target.value.trim(); sgpRedraw(); } });
renderNFL();

/* ---------- UFC: every rated fight, card by card in date order. These plays appear on this tab only. ---------- */
function renderUFC() {
  const U = D.ufc, el = $("ufc-body"); if (!el) return;
  if (!U || (!U.upcoming.length && !U.past.length)) { el.innerHTML = `<h2>UFC</h2><p class="empty">No UFC card has been built yet. It fills in with the daily update.</p>`; return; }
  const day = d => new Date(d + "T12:00:00").toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
  const am = v => (v == null ? "–" : showAm((v > 0 ? "+" : "") + v));
  // The pick's most likely way to win, then all three.
  const ways = p => [["knockout", p.pick_ko], ["submission", p.pick_sub], ["decision", p.pick_dec]].sort((x, y) => y[1] - x[1]);
  const how = p => { const m = ways(p); return `<b>By ${m[0][0]} ${m[0][1].toFixed(0)}%</b><div class="src">${m.slice(1).map(x => `${x[0]} ${x[1].toFixed(0)}%`).join(" · ")}</div>`; };
  const res = p => { const r = p.result; if (!r) return "";
    return r.hit == null ? `<span class="tag l0">No result</span>` : `${r.hit ? `<span class="tag l2">Hit</span>` : `<span class="tag miss">Missed</span>`} ${esc(r.winner)}${r.method ? ` · ${esc(r.method)}` : ""}${r.round ? ` R${r.round}` : ""}`; };
  // One stacked tile per fight, so nothing runs off the side of a phone screen.
  const table = (c, done) => `<div class="bbs">` + [...c.fights].sort((a, b) => (a.result ? 0 : 1) - (b.result ? 0 : 1)).map(p => { const m = ways(p);
    return `<div class="bb"><span class="ring l${p.chance >= 70 ? 2 : p.chance >= 60 ? 1 : 0}">${p.chance.toFixed(0)}%</span><span class="bb-main">` +
      `<span class="bb-tag">${esc(p.weight_class)}${p.rounds === 5 ? " · 5 rounds" : ""} · over ${esc(p.other)}</span>` +
      `<span class="bb-pick">${esc(p.pick)}</span>` +
      `<span class="bb-sub"><b class="hl">By ${m[0][0]} ${m[0][1].toFixed(0)}%</b> · ${m.slice(1).map(x => `${x[0]} ${x[1].toFixed(0)}%`).join(" · ")}</span>` +
      `<span class="bb-sub">Price ${am(p.price)} · goes the distance ${p.distance.toFixed(0)}%${p.chance >= 70 ? ` · <span class="tag l2">High</span>` : ""}</span>` +
      (done && p.result ? `<span class="bb-sub">${res(p)}</span>` : "") + `</span></div>`; }).join("") + `</div>`;
  // Fights likely to go to a decision (60% or better), strongest first. After the fight: did it go the distance?
  const went = p => (!p.result || !p.result.kind ? "" : p.result.kind === "Dec" ? `<span class="tag l2">Went the distance</span>` : `<span class="tag miss">Ended early</span> ${esc(p.result.method || "")}${p.result.round ? ` R${p.result.round}` : ""}`);
  const longTable = c => { const rows = c.fights.filter(p => p.distance >= 60).sort((x, y) => y.distance - x.distance);
    return !rows.length ? "" : `<div class="bbs">` + rows.map(p => `<div class="bb"><span class="ring l${p.distance >= 70 ? 2 : 1}">${p.distance.toFixed(0)}%</span><span class="bb-main">` +
      `<span class="bb-tag">${esc(p.weight_class)}${p.rounds === 5 ? " · 5 rounds" : ""}</span><span class="bb-pick">${esc(p.pick)} vs ${esc(p.other)}</span>` +
      `<span class="bb-sub"><b class="hl">Goes the distance ${p.distance.toFixed(0)}%</b> · ends early ${(100 - p.distance).toFixed(0)}%</span>` +
      `<span class="bb-sub">${esc(p.pick)} by decision ${p.pick_dec.toFixed(0)}% · ${esc(p.other)} by decision ${p.other_dec.toFixed(0)}%</span>` +
      (went(p) ? `<span class="bb-sub">${went(p)}</span>` : "") + `</span></div>`).join("") + `</div>`; };
  const view = SL.ufcView === "long" ? "long" : "win";
  const tally = c => { const g = c.fights.filter(p => p.result && p.result.hit != null), w = g.filter(p => p.result.hit).length; return g.length ? ` · <span class="${w * 2 >= g.length ? "ov" : "un"}">${w} of ${g.length} picks won</span>` : ""; };
  const head = (c, done) => `<h3 style="margin-top:22px">${day(c.date)} · ${esc(c.event)}${done ? tally(c) : ""}</h3>`;
  const R = U.record || {};
  const seg = `<div class="seg" role="group" aria-label="View" id="ufc-view" style="margin:10px 0 2px"><button type="button" id="uv-win" data-v="win" aria-pressed="${view === "win"}">Winners</button><button type="button" id="uv-long" data-v="long" aria-pressed="${view === "long"}">Goes the distance</button></div>`;
  if (view === "long") {
    const up = U.upcoming.map(c => { const t = longTable(c); return t ? head(c, false) + t : ""; }).join("");
    const old = U.past.map(c => { const t = longTable(c); if (!t) return ""; const g = c.fights.filter(p => p.distance >= 60 && p.result && p.result.kind), w = g.filter(p => p.result.kind === "Dec").length;
      return `<h3 style="margin-top:22px">${day(c.date)} · ${esc(c.event)}${g.length ? ` · <span class="${w * 2 >= g.length ? "ov" : "un"}">${w} of ${g.length} went the distance</span>` : ""}</h3>` + t; }).join("");
    el.innerHTML = `<h2>UFC</h2><div class="src" style="margin:4px 0 6px">Fights with a 60% or better chance of going to a decision · built ${esc(U.made)}</div>` + seg +
      (up || `<p class="empty">No upcoming fight reaches 60% to go the distance.</p>`) + (old ? `<h2 style="margin-top:30px">Past cards</h2>` + old : "") +
      `<p class="src" style="margin-top:14px">Goes the distance means the fight lasts every round and the judges decide it, whoever wins. In testing, fights the model put at 66% went the distance 62% of the time, so it runs a few points high. The feed has no price for this bet, so compare the chance with your sportsbook's: −150 needs 60%, −200 needs 67%, −250 needs 71%.</p>`;
    return;
  }
  el.innerHTML = `<h2>UFC</h2><div class="src" style="margin:4px 0 6px">Winner from the fight model and DraftKings' moneyline together · built ${esc(U.made)}` +
    (R.picks ? ` · record so far <b>${R.wins} of ${R.picks}</b> winners (${(100 * R.wins / R.picks).toFixed(0)}%, said ${R.said}%)` : "") + `</div>` + seg +
    (U.upcoming.length ? U.upcoming.map(c => head(c, c.fights.some(p => p.result)) + table(c, c.fights.some(p => p.result))).join("") : `<p class="empty">No upcoming card has prices yet.</p>`) +
    (U.past.length ? `<h2 style="margin-top:30px">Past cards</h2>` + U.past.map(c => head(c, true) + table(c, true)).join("") : "") +
    `<p class="src" style="margin-top:14px">The circle is the pick's chance to win. Under each name is the way he is most likely to win; the percentages are each way's share of all outcomes, so the three add up to the win chance. High marks winners at 70% or better. In testing the sportsbook's favorite won 68% of the time and the model did not beat it, so treat these as the likelier side, not an edge. The method numbers matched what happened in testing but could not be checked against sportsbook prices.</p>`;
}
$("ufc-body").addEventListener("click", e => { const b = e.target.closest("#ufc-view button"); if (b) { SL.ufcView = b.dataset.v; renderUFC(); } });
renderUFC();

/* ---------- Chat: anonymous, carried by the free ntfy.sh relay. Only messages since midnight Eastern are shown. ---------- */
const CHAT = { url: "https://ntfy.sh/joeybotnba-chat-7f3k9q2x8m4c1v6z", msgs: [], seen: new Set(), unread: 0, last: 0, es: null, day: 0 };
// Midnight Eastern today, in seconds since 1970.
function chatDay() {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" }).formatToParts(new Date()).map(x => [x.type, +x.value]));
  return Math.floor(Date.now() / 1000) - ((p.hour % 24) * 3600 + p.minute * 60 + p.second);
}
function chatDraw() {
  const log = $("chat-log"), open = !$("chat").hidden;
  log.innerHTML = CHAT.msgs.length ? CHAT.msgs.map(m => `<div><span class="who">${esc(m.n)}</span><span class="at">${new Date(m.t * 1000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}</span><div>${esc(m.m)}</div></div>`).join("")
    : `<p class="empty" style="margin:0">No messages yet today.</p>`;
  log.scrollTop = log.scrollHeight;
  if (open) CHAT.unread = 0;
  $("chat-dot").hidden = !CHAT.unread; $("chat-dot").textContent = CHAT.unread;
}
function chatTake(ev) {
  if (!ev || ev.event !== "message" || CHAT.seen.has(ev.id) || ev.time < CHAT.day) return;
  CHAT.seen.add(ev.id);
  let n = "anon", m = ev.message || "";
  try { const v = JSON.parse(m); if (v && typeof v.m === "string") { n = String(v.n || "anon"); m = v.m; } } catch (err) { /* plain text from outside the site */ }
  CHAT.msgs.push({ t: ev.time, n: n.slice(0, 20), m: m.slice(0, 300) });
  CHAT.msgs.sort((a, b) => a.t - b.t);
  if ($("chat").hidden) CHAT.unread++;
  chatDraw();
}
function chatConnect() {
  CHAT.day = chatDay();
  CHAT.msgs = CHAT.msgs.filter(m => m.t >= CHAT.day);
  if (CHAT.es) CHAT.es.close();
  try { CHAT.es = new EventSource(`${CHAT.url}/sse?since=${CHAT.day}`); CHAT.es.onmessage = e => { try { chatTake(JSON.parse(e.data)); } catch (err) { /* not a message */ } }; } catch (err) { /* chat is optional */ }
  chatDraw();
}
$("chat-btn").addEventListener("click", () => { const c = $("chat"); c.hidden = !c.hidden; $("chat-btn").setAttribute("aria-expanded", String(!c.hidden)); chatDraw(); if (!c.hidden) $($("chat-name").value ? "chat-text" : "chat-name").focus(); });
$("chat-form").addEventListener("submit", async e => {
  e.preventDefault();
  const n = $("chat-name").value.trim().slice(0, 20) || "anon", m = $("chat-text").value.trim().slice(0, 300);
  if (!m || Date.now() - CHAT.last < 2000) return;
  CHAT.last = Date.now();
  try { localStorage.setItem("chat-name", n); } catch (err) {}
  $("chat-text").value = "";
  try { const r = await fetch(CHAT.url, { method: "POST", body: JSON.stringify({ n, m }) }); if (!r.ok) throw new Error(r.status); }
  catch (err) { $("chat-text").value = m; $("chat-text").placeholder = "Couldn't send. Try again."; }
});
try { $("chat-name").value = localStorage.getItem("chat-name") || ""; } catch (err) {}
chatConnect();
// At midnight Eastern the day's messages drop off and the feed restarts from the new day.
setInterval(() => { if (chatDay() !== CHAT.day && chatDay() - CHAT.day > 3600) chatConnect(); }, 60000);

// Open the tab named in the address bar, now that every section is ready.
if (TABS.includes(location.hash.slice(1))) showTab(location.hash.slice(1));
</script>
