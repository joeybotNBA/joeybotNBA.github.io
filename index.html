/* Layout: one column of controls, then headline tiles, a period-by-period bar table, and two side-by-side tables. */
/* Dark arena: one always-dark look, navy surfaces with a basketball-orange accent. */
:root {

  --body: system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
body { background: var(--plane); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.45; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 40px; display: flex; flex-direction: column; gap: 20px; }
h1 { font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1; margin: 0; letter-spacing: 0.01em; text-transform: uppercase; }
h2 { font-family: var(--display); font-weight: 600; font-size: 20px; margin: 0; text-transform: uppercase; letter-spacing: 0.03em; }
.sub { color: var(--ink2); margin: 6px 0 0; }
.label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink2); }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 16px; min-width: 0; }

.controls { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 14px 20px; align-items: flex-end; }
.field { display: flex; flex-direction: column; gap: 5px; }
select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--axis); border-radius: 4px; padding: 7px 10px; min-width: 120px; }
.seg { display: inline-flex; border: 1px solid var(--axis); border-radius: 4px; overflow: hidden; }
.seg button { font: inherit; font-weight: 600; color: var(--ink2); background: var(--surface); border: 0; border-left: 1px solid var(--axis); padding: 7px 16px; cursor: pointer; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--axis); border-radius: 999px; padding: 5px 12px; cursor: pointer; display: inline-flex; gap: 8px; align-items: baseline; }
.chip small { color: var(--muted); font-size: 12px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip[aria-pressed="true"] .nm { text-decoration: line-through; }
.chip[aria-pressed="true"] small { color: var(--surface); opacity: 0.8; }
.chip:disabled { cursor: default; opacity: 0.5; }
.link { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
button:focus-visible, select:focus-visible, th:focus-visible, tr:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.status { color: var(--ink2); }

.warn { display: inline-block; margin-left: 8px; padding: 1px 8px; border: 1px solid var(--axis); border-radius: 999px; font-size: 12px; font-weight: 600; }

.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.tile { display: flex; flex-direction: column; gap: 2px; }
.big { font-family: var(--display); font-weight: 700; font-size: 52px; line-height: 1; }
.big span { font-size: 26px; font-weight: 600; margin-left: 1px; }
.rec { color: var(--ink2); font-variant-numeric: tabular-nums; }
.delta { font-weight: 600; font-variant-numeric: tabular-nums; }
.up { color: var(--good); } .down { color: var(--bad); } .flat { color: var(--ink2); }

.periods { display: grid; grid-template-columns: 96px 92px minmax(80px, 1fr) 56px 74px; gap: 10px 14px; align-items: center; margin-top: 12px; }
.periods .hd { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink2); }

.track { position: relative; height: 12px; background: var(--accent-soft); border-radius: 0 4px 4px 0; }

.mid { position: absolute; left: 50%; top: -4px; bottom: -4px; width: 1px; background: var(--ink2); }
.base { position: absolute; top: -5px; bottom: -5px; width: 3px; margin-left: -1.5px; background: var(--ink); border: 1px solid var(--surface); box-sizing: content-box; border-radius: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 14px; color: var(--ink2); font-size: 12px; }

.two { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 20px; }
.scroll { overflow: auto; max-height: 460px; margin-top: 10px; }

tr.pick { cursor: pointer; }

.res { display: inline-block; width: 18px; margin-left: 6px; font-weight: 700; text-align: center; }
.res.W { color: var(--good); } .res.L { color: var(--bad); } .res.T { color: var(--ink2); }
.note { color: var(--ink2); font-size: 12.5px; max-width: 78ch; margin: 0; }
.empty { color: var(--ink2); padding: 20px 0; }

.slip-top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

.slip-nums { font-size: 14px; color: var(--ink2); display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }

const logo = (ab, cls) => (D.names[ab] ? `<img class="logo${cls ? " " + cls : ""}" src="https://a.espncdn.com/i/teamlogos/nba/500-dark/${LOGO_AB[ab] || ab.toLowerCase()}.png" alt="" onerror="this.hidden=true">` : "");

function score(g, k) {
  switch (k) {
    case "Q1": return [g[3], g[4]];
    case "Q2": return [g[5], g[6]];
    case "Q3": return [g[7], g[8]];
    case "Q4": return [g[9], g[10]];
    case "H1": return [g[3] + g[5], g[4] + g[6]];
    case "H2": return [g[7] + g[9], g[8] + g[10]];
    default: return [g[11], g[12]];
  }
}
function tally(list, k) {
  let w = 0, l = 0, t = 0, m = 0;
  for (const g of list) {
    const [f, a] = score(g, k);
    if (f > a) w++; else if (f < a) l++; else t++;
    m += f - a;
  }
  const n = list.length;

// Score after Q1 or at halftime from the live feed, if those quarters are finished.

  const sum = ls => ls.slice(0, n).reduce((x, y) => x + y, 0);
  return { a: sum(g.away.ls), h: sum(g.home.ls) };
}

  const p = SL.per[g.id] || "H1", nm = p === "FG" ? "game" : PNAME[p], el = $("pb-" + g.id);

  renderMarkets(g, "pre-" + p, p === "FG" ? fg() : preMarkets(g, p), el);

/* ---------- Player props: model chance of a prop hitting, from live ESPN game logs ---------- */
const PP_TEAM = "https://site.api.espn.com/apis/site/v2/sports/basketball/";
const PP_LOG = "https://site.web.api.espn.com/apis/common/v3/sports/basketball/";
const PROPS = {
  pts: ["Points", ["points"]], reb: ["Rebounds", ["totalRebounds"]], ast: ["Assists", ["assists"]], tpm: ["Threes made", ["threes"]],
  stl: ["Steals", ["steals"]], blk: ["Blocks", ["blocks"]], sb: ["Steals + Blocks", ["steals", "blocks"]],
  pra: ["Pts + Reb + Ast", ["points", "totalRebounds", "assists"]], pr: ["Pts + Reb", ["points", "totalRebounds"]],
  pa: ["Pts + Ast", ["points", "assists"]], ra: ["Reb + Ast", ["totalRebounds", "assists"]], tov: ["Turnovers", ["turnovers"]],
};
const PP = { gid: "", side: "away", pid: "", prop: "pts", n: 10, venue: "all", line: "", open: false, rosters: {}, logs: {}, absent: {}, seq: 0 };
const ppGames = () => [...SL.games, ...WL.games];
const ppLg = g => g.lg || "nba";
const ppVal = (row, prop) => PROPS[prop][1].reduce((s, k) => s + row[k], 0);
const mean = a => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : null);

async function ppRoster(g, side) {
  const key = `${ppLg(g)}|${g[side].id}`;
  if (PP.rosters[key]) return PP.rosters[key];
  const res = await fetch(`${PP_TEAM}${ppLg(g)}/teams/${g[side].id}/roster`);
  if (!res.ok) throw new Error(res.status);

    id: a.id, name: a.displayName, pos: (a.position || {}).abbreviation || "", img: (a.headshot || {}).href || "" }));
  return (PP.rosters[key] = list.sort((a, b) => a.name.localeCompare(b.name)));

// One season of a player's regular-season and playoff games, newest first.
async function ppSeason(lg, pid, year) {
  const res = await fetch(`${PP_LOG}${lg}/athletes/${pid}/gamelog${year ? `?season=${year}` : ""}`);
  if (!res.ok) throw new Error(res.status);
  const d = await res.json(), idx = Object.fromEntries((d.names || []).map((n, i) => [n, i])), rows = [];
  const num = (st, name) => parseFloat(st[idx[name]]) || 0;
  for (const st of d.seasonTypes || []) {
    if (/preseason/i.test(st.displayName || "")) continue;
    const post = /postseason/i.test(st.displayName || "");
    for (const cat of st.categories || []) for (const ev of cat.events || []) {
      const meta = (d.events || {})[ev.eventId]; if (!meta || !ev.stats) continue;
      const s = ev.stats, three = String(s[idx["threePointFieldGoalsMade-threePointFieldGoalsAttempted"]] || "0").split("-")[0];
      rows.push({ id: ev.eventId, tid: (meta.team || {}).id || "", tab: (meta.team || {}).abbreviation || "", when: new Date(meta.gameDate), post, opp: (meta.opponent || {}).abbreviation || "", away: meta.atVs === "@", min: num(s, "minutes"),
        points: num(s, "points"), totalRebounds: num(s, "totalRebounds"), assists: num(s, "assists"), steals: num(s, "steals"),
        blocks: num(s, "blocks"), turnovers: num(s, "turnovers"), threes: parseFloat(three) || 0 });
    }
  }
  const label = (((d.seasonTypes || [])[0] || {}).displayName || "").split(" ")[0];
  return { rows: rows.sort((a, b) => b.when - a.when), season: label };
}
// cur = the season in progress (or the latest one played); prev = the season before it, fetched only when asked for.
async function ppLog(lg, pid, withPrev) {
  const key = `${lg}|${pid}`, L = PP.logs[key] || (PP.logs[key] = {});
  L.pid = pid;
  if (!L.cur) { const c = await ppSeason(lg, pid); L.cur = c.rows; L.season = c.season; L.prev = []; L.prevSeason = ""; }
  if (withPrev && !L.prevDone) {
    const end = parseInt(L.season.slice(0, 4), 10) + (L.season.includes("-") ? 1 : 0);   // "2025-26" ends in 2026; "2026" is 2026
    if (end) { try { const p = await ppSeason(lg, pid, end - 1); if (p.season !== L.season) { L.prev = p.rows; L.prevSeason = p.season; } } catch (err) { /* no earlier season */ } }
    L.prevDone = true;

// Chance a count with mean mu and variance phi x mu lands above the line.
function nbOver(mu, phi, line) {
  mu = Math.max(mu, 1e-6); phi = Math.max(phi, 1.02);
  const r = mu / (phi - 1), q = 1 - 1 / phi, kmax = Math.floor(line);

  for (let k = 0; k < kmax; k++) { pmf *= ((k + r) / (k + 1)) * q; cdf += pmf; }
  return 1 - cdf;

// Regular teammates listed Out tonight, for one team: each one's usual minutes and the games he played, so a player's
// projection can be lifted by the part of that absence his own recent games do not already show.
async function loadAbsent(g, side) {
  const key = `${g.id}|${side}`, I = injList(g), A = D.props.abs;
  if (!I || !A) { PP.absent[key] = null; return; }
  if (PP.absent[key] && PP.absent[key].n === (I[g[side].name] || []).length) return;
  const outs = (I[g[side].name] || []).filter(i => i.status === "Out" && i.aid);
  const list = (await pool(outs, async i => {
    try {
      let log = await ppLog(ppLg(g), i.aid, false);
      if (log.cur.length < A.games) log = await ppLog(ppLg(g), i.aid, true);
      const src = log.cur.length ? log.cur : log.prev, last = src.slice(0, A.window);
      if (last.length < A.games) return null;

function absentFor(log, g, side) {

  const mine = (log.cur.length ? log.cur : log.prev).slice(0, A.window); let x = 0; const names = [];
  if (mine.length) for (const j of list) { if (j.aid === log.pid) continue;
    const part = j.mpg * mine.filter(r => j.keys.has(`${r.id}|${r.opp}`)).length / mine.length;

    `<details id="rec-more" style="margin-top:26px"${SL.recMore ? " open" : ""}><summary style="cursor:pointer;color:var(--ink2);font-size:14px">More detail: totals, breakdowns and game lines</summary>` + pick +
    `<h3 style="margin-top:14px">${esc(cat.name)} since logging began</h3>` + tb(["Group", "Bets", "Won-lost", "Hit rate", "Units", "Avg vs line", "Beat the close"], groups.map(line)) +
    `<h3 style="margin-top:18px">By the chance the site gave</h3>` + tb(["Chance given", "Bets", "Won-lost", "Hit rate", "Units", "Avg vs line", "Beat the close"], cat.bands.filter(g => g.bets).map(line)) +
    (cat.types || []).map(t => { const rows = t.rows.filter(r => r.bets); return rows.length ? `<h3 style="margin-top:18px">${esc(t.title)}</h3>` + tb(["Type", "Bets", "Won-lost", "Hit rate", "Units", "Avg vs line", "Beat the close"], rows.map(line)) : ""; }).join("") +
    (lines ? `<h3 style="margin-top:26px">Game lines and results</h3>` + lines : "") + `</details>`;
}
$("rec-body").addEventListener("click", e => { const b = e.target.closest("#rec-cat button"); if (b) { SL.recCat = b.dataset.c; renderRecord(); } });
$("rec-body").addEventListener("click", e => { const b = e.target.closest("#rec-med button"); if (b) { SL.recMed = b.dataset.m === "1"; renderRecord(); } });
$("rec-body").addEventListener("toggle", e => { if (e.target.id === "rec-more") SL.recMore = e.target.open;
  else if (e.target.classList.contains("rec-day")) (SL.recDay = SL.recDay || {})[e.target.dataset.k] = e.target.open; }, true);
renderRecord();
/* ---------- NFL: this week's plays from the NFL model, with DraftKings' lines and where Venom agrees ---------- */
const NFL_CATS = [["td", "Anytime TD"], ["pass", "Passing"], ["rec", "Receiving"], ["rush", "Rushing"]];
const nflGames = () => Object.fromEntries(((D.nfl || {}).games || []).map(g => [g.id, g]));
const nflWhen = g => { const d = new Date((g || {}).when); return !g ? "" : g.state === "post" ? "final" : g.state === "in" ? "in progress" : isNaN(d) ? "" : d.toLocaleDateString([], { weekday: "short" }) + " " + d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); };
const nflWho = (r, games) => `<b>${esc(r.player)}</b> <span class="src">${esc(r.team)} ${r.home ? "vs" : "at"} ${esc(r.opp)} · ${nflWhen(games[r.game])}</span>`;
const nflLevel = (p, hi, mid) => `<span class="tag l${p >= hi ? 2 : p >= mid ? 1 : 0}">${p >= hi ? "High" : p >= mid ? "Medium" : "Low"}</span>`;
const nflVenom = a => (a === 2 ? `<span class="tag l2">Both models</span>` : a === 1 ? `<span class="tag l0">Venom likes him</span>` : a === -1 ? `<span class="tag l1">Venom disagrees</span>` : "");
// One stat for one player: the pick against the line, the projection and the chance.
const nflLeg = (x, hi = 60, mid = 56) => (!x ? `<span class="src">no line</span>` : `<b class="${x.over ? "ov" : "un"}">${x.over ? "Over" : "Under"} ${x.line}</b> <span class="hitc">${x.p.toFixed(0)}%</span><div class="src">projects ${x.proj} · recent ${x.avg}</div>`);
// The table for one category. n limits the rows (for the short lists on the NFL tab).
// Only High-conviction plays are listed, strongest first, at most n (10 a category).
// High: a touchdown both models put at 40% or better (those scored 62% of the time in testing) or this model alone at 48%;
// a line play at 60% or better on at least one of the player's lines.
const nflTop = x => Math.max(...[x.rec, x.yds, x.td, x].filter(y => y && typeof y === "object" && y.p != null).map(y => y.p));
const nflHigh = (cat, r) => (cat === "td" ? r.agree === 2 || r.p >= 48 : nflTop(r) >= 60);
function nflTable(cat, n) {
  const N = D.nfl, games = nflGames(), v = N.venom, all = ((N.groups || {})[cat] || []).filter(r => nflHigh(cat, r));
  const rows = (cat === "td" ? all : [...all].sort((x, y) => y.s - x.s)).slice(0, n || 10);
  if (!rows.length) return `<p class="empty">No High-conviction play here this week, or the sportsbook has not posted these lines yet.</p>`;
  const th = cols => `<thead><tr><th>#</th><th class="l">Player</th>${cols.map(c => `<th>${c}</th>`).join("")}${v ? "<th>Second model</th>" : ""}</tr></thead><tbody>`;
  const tr = (r, i, cells, agree) => `<tr class="go${SL.nflPick === r.pid && !n ? " sel" : ""}" tabindex="0" data-np="${r.pid}" data-nc="${cat}"><td class="rank">${i + 1}</td><td class="l">${nflWho(r, games)}</td>${cells.map(c => `<td class="nw">${c}</td>`).join("")}${v ? `<td>${nflVenom(agree)}</td>` : ""}</tr>`;
  const best = (...xs) => Math.max(...xs.filter(Boolean).map(x => x.p));
  const body = cat === "td" ? th(["Chance"]) + rows.map((r, i) => tr(r, i, [`<span class="hitc">${r.p.toFixed(0)}%</span>`], r.agree)).join("")
    : cat === "rush" ? th(["Rushing yards"]) + rows.map((r, i) => tr(r, i, [nflLeg(r)], r.agree)).join("")
    : cat === "rec" ? th(["Receptions", "Receiving yards", "Together"]) + rows.map((r, i) => tr(r, i, [nflLeg(r.rec), nflLeg(r.yds),
        r.tandem ? `<span class="tag l2">Tandem ${r.rec.over ? "over" : "under"}</span>` : r.rec && r.yds ? `<span class="tag l0">Split</span>` : ""], (r.rec || r.yds).agree)).join("")
    : th(["Passing yards", "Passing TDs", "Together"]) + rows.map((r, i) => tr(r, i, [nflLeg(r.yds), nflLeg(r.td),
        r.tandem ? `<span class="tag l2">Tandem ${r.yds.over ? "over" : "under"}</span>` : r.yds && r.td ? `<span class="tag l0">Split</span>` : ""], (r.yds || r.td).agree)).join("");
  return `<div class="tw"><table class="ptab">${body}</tbody></table></div>` +
    (!n && rows.length < 10 ? `<p class="src" style="margin-top:8px">${rows.length} High-conviction play${rows.length === 1 ? "" : "s"} in this category this week. Nothing else reaches the bar, so the list stops there.</p>` : "");
}
// Last 10 games for one stat as bars against the line: green over, red under.
const NFL_COL = { td: 1, rec: 2, rec_yds: 3, rush_yds: 4, pass_yds: 5, pass_td: 6 };
function nflChart(pid, stat, name, line) {
  const games = ((D.nfl.hist || {})[pid] || []), vals = games.map(g => g[NFL_COL[stat]]);
  if (!vals.length) return "";
  const avg = vals.reduce((a, b) => a + b, 0) / vals.length, over = vals.filter(v => v > line).length, under = vals.filter(v => v < line).length;
  const top = Math.max(line, ...vals, 1) * 1.12, gap = avg - line, td = stat === "td";
  const cols = games.slice().reverse().map(g => { const v = g[NFL_COL[stat]], cls = v > line ? "over" : v < line ? "under" : "push", bits = g[0].split(" "), opp = bits.pop(), at = bits.pop(), wk = bits.join(" ");
    return `<div class="pp-col" title="${esc(g[0])}: ${v} ${name.toLowerCase()}"><div class="pp-bar ${cls}" style="height:${Math.max((v / top) * 100, 9)}%"><span>${v}</span></div><div class="pp-x">${esc(wk)}<br>${at === "@" ? "@" : ""}${esc(opp)}</div></div>`; }).join("");
  return `<div style="margin-top:18px"><h3 style="margin-bottom:2px">${name}</h3><div class="src" style="margin-bottom:8px">` +
    (td ? `Scored in <b>${over} of ${vals.length}</b> · ${avg.toFixed(1)} touchdowns a game`
      : `Line <b>${line}</b> · last ${vals.length} average <b>${avg.toFixed(1)}</b> <span class="edge ${gap > 0 ? "up" : gap < 0 ? "down" : ""}">(${gap > 0 ? "+" : gap < 0 ? "−" : ""}${Math.abs(gap).toFixed(1)} vs the line)</span> · over in <b>${over} of ${vals.length}</b>, under in ${under}`) + `</div>` +
    `<div class="pp-chart" style="height:200px"><div class="pp-line" style="bottom:calc(34px + (100% - 34px) * ${line / top})"><span>${td ? "1 TD" : line}</span></div>${cols}</div></div>`;
}
// The card for the picked player: one chart for each stat in the category.
function nflCard(cat) {
  const N = D.nfl, rows = ((N.groups || {})[cat] || []).filter(r => nflHigh(cat, r)), r = rows.find(x => x.pid === SL.nflPick); if (!r) return "";
  const games = nflGames(), pick = x => (x ? `<b class="${x.over ? "ov" : "un"}">${x.over ? "Over" : "Under"} ${x.line}</b> (${x.p.toFixed(0)}%)` : "");
  const charts = cat === "td" ? nflChart(r.pid, "td", "Touchdowns", 0.5)
    : cat === "rush" ? nflChart(r.pid, "rush_yds", "Rushing yards", r.line)
    : cat === "rec" ? (r.rec ? nflChart(r.pid, "rec", "Receptions", r.rec.line) : "") + (r.yds ? nflChart(r.pid, "rec_yds", "Receiving yards", r.yds.line) : "")
    : (r.yds ? nflChart(r.pid, "pass_yds", "Passing yards", r.yds.line) : "") + (r.td ? nflChart(r.pid, "pass_td", "Passing touchdowns", r.td.line) : "");
  const head = cat === "td" ? `Anytime touchdown · <span class="hitc">${r.p.toFixed(0)}%</span>` : cat === "rush" ? pick(r) : [pick(cat === "rec" ? r.rec : r.yds), pick(cat === "rec" ? r.yds : r.td)].filter(Boolean).join(" · ");
  return `<div id="nfl-card" style="margin-top:22px;padding-top:16px;border-top:1px solid var(--border)"><h2>${esc(r.player)}</h2>` +
    `<div class="src" style="margin-top:2px">${esc(r.team)} ${r.home ? "vs" : "at"} ${esc(r.opp)} · ${nflWhen(games[r.game])} · ${head} ${N.venom ? nflVenom(cat === "td" || cat === "rush" ? r.agree : ((r.rec || r.yds || r.td) || {}).agree) : ""}</div>` +
    (charts || `<p class="empty">No past games on file for this player.</p>`) + `</div>`;
}
const nflNote = `<p class="src" style="margin-top:10px">The feed carries DraftKings' lines but not its prices, so check the price before betting. Tandem means the player's two lines lean the same way, so they can be bet together. "Venom disagrees" marks an under on a player Venom rates highly. Players whose line is far from their recent numbers are left out: that usually means a role change the model cannot see.</p>`;
// Player props tab, NFL selected: every play in one category at a time.
function nflProps() {
  const N = D.nfl; if (!N || !N.groups) return `<h2>NFL props</h2><p class="empty">No NFL week has been built yet. It fills in with the daily update.</p>`;
  const cat = NFL_CATS.some(c => c[0] === SL.nflCat) ? SL.nflCat : "td";
  // Open the top play's chart unless a player in this category's list is already picked.
  const high = ((N.groups || {})[cat] || []).filter(r => nflHigh(cat, r)), shown = (cat === "td" ? high : [...high].sort((x, y) => y.s - x.s)).slice(0, 10);
  if (shown.length && !shown.some(r => r.pid === SL.nflPick)) SL.nflPick = shown[0].pid;
  return `<h2 style="margin-bottom:4px">NFL props · Week ${N.week}</h2><div class="src" style="margin-bottom:10px">High-conviction plays only, up to 10 a category · the NFL model against DraftKings' lines${N.venom ? ", cross-checked with Venom" : ""} · built ${esc(N.made)}</div>` +
    `<div class="seg" role="group" aria-label="Category" id="nfl-cat" style="flex-wrap:wrap;margin-bottom:12px">` + NFL_CATS.map(([k, name]) => `<button type="button" id="nc-${k}" data-c="${k}" aria-pressed="${k === cat}">${name}</button>`).join("") + `</div>` +
    `<div class="src" style="margin-bottom:6px">Tap a player to see his last 10 games against the line.</div>` + nflTable(cat) + nflCard(cat) + (cat === "td" ? "" : nflNote);
}
// NFL tab: the week's games and the top few plays in each category.
function renderNFL() {
  const N = D.nfl, el = $("nfl-body"); if (!el) return;
  if (!N || !N.groups) { el.innerHTML = `<h2>NFL</h2><p class="empty">No NFL week has been built yet. It fills in with the daily update.</p>`; return; }
  const line = g => (g.spread_home == null ? "–" : g.spread_home === 0 ? "pick'em" : `${g.spread_home < 0 ? g.home : g.away} −${Math.abs(g.spread_home)}`);
  // Game picks, most likely winner first. A winner is High at 70% or better: in testing those won 67% (70 to 80%) and 21 of 21 (80%+).
  const picks = N.games.filter(g => g.pick).sort((x, y) => y.pick.p - x.pick.p);
  const tot = g => (g.pick.tp >= 55 ? `<b class="${g.pick.over ? "ov" : "un"}">${g.pick.over ? "Over" : "Under"} ${g.total}</b> <span class="hitc">${g.pick.tp.toFixed(0)}%</span>${g.pick.tprice ? ` <span class="src">${showAm(g.pick.tprice)}</span>` : ""}`
    : `<span class="src">${g.total} · no lean (${g.pick.over ? "over" : "under"} ${g.pick.tp.toFixed(0)}%)</span>`);
  el.innerHTML = `<h2>NFL · Week ${N.week}</h2><div class="src" style="margin:4px 0 10px">Built ${esc(N.made)}</div>` +
    `<h3 style="margin-top:6px">Game picks</h3><div class="tw"><table class="ptab"><thead><tr><th>#</th><th class="l">Game</th><th>Winner</th><th>Moneyline</th><th>Spread</th><th>Total</th></tr></thead><tbody>` +
    picks.map((g, i) => `<tr><td class="rank">${i + 1}</td><td class="l"><b>${esc(g.away)} at ${esc(g.home)}</b> <span class="src">${nflWhen(g)}</span></td>` +
      `<td class="nw"><b>${esc(g.pick.team)}</b> <span class="hitc">${g.pick.p.toFixed(0)}%</span>${g.pick.p >= 70 ? ` <span class="tag l2">High</span>` : ""}</td>` +
      `<td class="nw">${g.pick.price ? showAm(g.pick.price) : "–"}</td><td class="nw">${line(g)}</td><td class="nw">${tot(g)}</td></tr>`).join("") + `</tbody></table></div>` +
    `<p class="src" style="margin-top:8px">The winner's chance comes from the sportsbook's spread, which tested as the best guide: my own team ratings added nothing to it over 170 test games, and on totals my number lost to the sportsbook's more often than it won. So a total only shows a pick when the lean reaches 55%, and most weeks none will. Moneyline favorites this strong are priced steeply, so they suit parlay legs more than single bets.</p>` +
    NFL_CATS.map(([k, name]) => `<h3 style="margin-top:22px">Top ${name.toLowerCase()} plays</h3>` + nflTable(k, 5)).join("") +
    `<div style="margin-top:16px"><button type="button" class="btn" id="nfl-all">See all NFL props</button></div>`;
}
$("nfl-body").addEventListener("click", e => { const tr = e.target.closest("[data-np]");
  if (tr) { SL.nflCat = tr.dataset.nc; SL.nflPick = tr.dataset.np; }
  if (tr || e.target.id === "nfl-all") { PP.slate = "nfl"; showTab("props"); renderSlateLists(); if (tr && $("nfl-card")) $("nfl-card").scrollIntoView({ behavior: "smooth", block: "start" }); } });
$("pp-slate").addEventListener("click", e => { const b = e.target.closest("#nfl-cat button"), c = e.target.closest("#nfl-side button");
  const tr = e.target.closest("[data-np]");
  if (b) SL.nflCat = b.dataset.c; else if (c) SL.nflSide = c.dataset.s; else if (tr) SL.nflPick = tr.dataset.np; else return;
  renderSlateLists();
  if (tr && $("nfl-card")) $("nfl-card").scrollIntoView({ behavior: "smooth", block: "nearest" }); });
renderNFL();

/* ---------- Chat: anonymous, carried by the free ntfy.sh relay. Only messages since midnight Eastern are shown. ---------- */
const CHAT = { url: "https://ntfy.sh/joeybotnba-chat-7f3k9q2x8m4c1v6z", msgs: [], seen: new Set(), unread: 0, last: 0, es: null, day: 0 };
// Midnight Eastern today, in seconds since 1970.
function chatDay() {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" }).formatToParts(new Date()).map(x => [x.type, +x.value]));
  return Math.floor(Date.now() / 1000) - ((p.hour % 24) * 3600 + p.minute * 60 + p.second);
}
function chatDraw() {
  const log = $("chat-log"), open = !$("chat").hidden;
  log.innerHTML = CHAT.msgs.length ? CHAT.msgs.map(m => `<div><span class="who">${esc(m.n)}</span><span class="at">${new Date(m.t * 1000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}</span><div>${esc(m.m)}</div></div>`).join("")
    : `<p class="empty" style="margin:0">No messages yet today.</p>`;
  log.scrollTop = log.scrollHeight;
  if (open) CHAT.unread = 0;
  $("chat-dot").hidden = !CHAT.unread; $("chat-dot").textContent = CHAT.unread;
}
function chatTake(ev) {
  if (!ev || ev.event !== "message" || CHAT.seen.has(ev.id) || ev.time < CHAT.day) return;
  CHAT.seen.add(ev.id);
  let n = "anon", m = ev.message || "";
  try { const v = JSON.parse(m); if (v && typeof v.m === "string") { n = String(v.n || "anon"); m = v.m; } } catch (err) { /* plain text from outside the site */ }
  CHAT.msgs.push({ t: ev.time, n: n.slice(0, 20), m: m.slice(0, 300) });
  CHAT.msgs.sort((a, b) => a.t - b.t);
  if ($("chat").hidden) CHAT.unread++;
  chatDraw();
}
function chatConnect() {
  CHAT.day = chatDay();
  CHAT.msgs = CHAT.msgs.filter(m => m.t >= CHAT.day);
  if (CHAT.es) CHAT.es.close();
  try { CHAT.es = new EventSource(`${CHAT.url}/sse?since=${CHAT.day}`); CHAT.es.onmessage = e => { try { chatTake(JSON.parse(e.data)); } catch (err) { /* not a message */ } }; } catch (err) { /* chat is optional */ }
  chatDraw();
}
$("chat-btn").addEventListener("click", () => { const c = $("chat"); c.hidden = !c.hidden; $("chat-btn").setAttribute("aria-expanded", String(!c.hidden)); chatDraw(); if (!c.hidden) $($("chat-name").value ? "chat-text" : "chat-name").focus(); });
$("chat-form").addEventListener("submit", async e => {
  e.preventDefault();
  const n = $("chat-name").value.trim().slice(0, 20) || "anon", m = $("chat-text").value.trim().slice(0, 300);
  if (!m || Date.now() - CHAT.last < 2000) return;
  CHAT.last = Date.now();
  try { localStorage.setItem("chat-name", n); } catch (err) {}
  $("chat-text").value = "";
  try { const r = await fetch(CHAT.url, { method: "POST", body: JSON.stringify({ n, m }) }); if (!r.ok) throw new Error(r.status); }
  catch (err) { $("chat-text").value = m; $("chat-text").placeholder = "Couldn't send. Try again."; }
});
try { $("chat-name").value = localStorage.getItem("chat-name") || ""; } catch (err) {}
chatConnect();
// At midnight Eastern the day's messages drop off and the feed restarts from the new day.
setInterval(() => { if (chatDay() !== CHAT.day && chatDay() - CHAT.day > 3600) chatConnect(); }, 60000);

// Open the tab named in the address bar, now that every section is ready.
if (TABS.includes(location.hash.slice(1))) showTab(location.hash.slice(1));
</script>
